<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 80" fill="none">
  <!-- ═══════════════════════════════════════════════════════
       SEMATELMED — Logo Oficial Corporativo
       Isotipo: Camaleón estilizado + Texto + Eslogan
       Fondo: 100% Transparente | Elementos: Blanco #FFFFFF
       ═══════════════════════════════════════════════════════ -->

  <defs>
    <!-- Suavizado de bordes para el isotipo -->
    <filter id="smooth" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.3"/>
    </filter>
  </defs>

  <!-- ─── ISOTOPO: Camaleón Estilizado ─── -->
  <g transform="translate(6, 8)" filter="url(#smooth)">

    <!-- Cuerpo principal — forma orgánica ovalada -->
    <path d="
      M 32 12
      C 42 8, 52 14, 50 26
      C 48 38, 36 44, 26 42
      C 16 40, 10 32, 12 22
      C 14 14, 22 10, 32 12
      Z
    " fill="#FFFFFF" opacity="0.95"/>

    <!-- Cabeza — esfera derecha con forma de casco -->
    <ellipse cx="18" cy="16" rx="14" ry="12" fill="#FFFFFF" opacity="0.97"/>

    <!-- Cresta dorsal — arco superior con 3 puntas -->
    <path d="
      M 16 5
      Q 18 -2, 22 4
      Q 24 -4, 28 3
      Q 31 -2, 34 6
    " stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.92"/>

    <!-- Ojo — anillo exterior + pupila + reflejo -->
    <circle cx="11" cy="13" r="5.5" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.95"/>
    <circle cx="10.5" cy="12.5" r="2.8" fill="#FFFFFF" opacity="1"/>
    <circle cx="9.5" cy="11.5" r="1" fill="#4A2CB3" opacity="0.8"/>

    <!-- Hocico / boca — curva suave -->
    <path d="M 5 18 Q 3 16, 5 14" stroke="#FFFFFF" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.7"/>

    <!-- Cola — espiral elegante -->
    <path d="
      M 50 26
      Q 58 24, 56 18
      Q 54 12, 48 14
      Q 44 16, 46 20
      Q 48 22, 50 20
    " stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>

    <!-- Patas delanteras -->
    <line x1="16" y1="28" x2="12" y2="40" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" opacity="0.85"/>
    <line x1="24" y1="30" x2="22" y2="42" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" opacity="0.85"/>

    <!-- Patas traseras -->
    <line x1="36" y1="32" x2="38" y2="44" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" opacity="0.85"/>
    <line x1="44" y1="28" x2="48" y2="38" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Dedos de las patas (detalles sutiles) -->
    <path d="M 10 40 L 8 42 M 12 40 L 14 42" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 20 42 L 18 44 M 22 42 L 24 44" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 36 44 L 34 46 M 38 44 L 40 46" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <path d="M 47 38 L 45 40 M 49 38 L 51 40" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

    <!-- Línea dorsal sutil -->
    <path d="M 22 8 Q 35 12, 48 18" stroke="#FFFFFF" stroke-width="0.8" fill="none" opacity="0.3"/>
  </g>

  <!-- ─── TEXTO PRINCIPAL: Sematelmed ─── -->
  <text x="76" y="38" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">
    Sematelmed
  </text>

  <!-- ─── ESLOGAN: SIEMPRE A LA VANGUARDIA ─── -->
  <text x="77" y="56" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="500" fill="#FFFFFF" opacity="0.65" letter-spacing="3.5">
    SIEMPRE A LA VANGUARDIA
  </text>

</svg>

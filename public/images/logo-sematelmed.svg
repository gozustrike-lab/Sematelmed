<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 80" fill="none">
  <!-- Chameleon Icon -->
  <g transform="translate(8, 12)">
    <!-- Body -->
    <ellipse cx="24" cy="28" rx="18" ry="14" fill="white" opacity="0.95"/>
    <!-- Head -->
    <circle cx="6" cy="22" r="10" fill="white" opacity="0.95"/>
    <!-- Eye ring -->
    <circle cx="2" cy="20" r="5" fill="none" stroke="#1DBD6B" stroke-width="1.5"/>
    <!-- Pupil -->
    <circle cx="1.5" cy="19.5" r="2.2" fill="#4A2CB3"/>
    <!-- Tail curl -->
    <path d="M42 30 Q52 26 50 18 Q48 10 40 14" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.95"/>
    <!-- Legs -->
    <line x1="14" y1="40" x2="12" y2="50" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="22" y1="41" x2="22" y2="51" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="30" y1="41" x2="32" y2="51" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="38" y1="38" x2="42" y2="47" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <!-- Crest -->
    <path d="M18 14 Q20 4 24 12 Q26 4 30 14" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85"/>
  </g>
  <!-- Brand Name -->
  <text x="72" y="42" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="white" letter-spacing="1">
    Sematelmed
  </text>
  <!-- Tagline -->
  <text x="72" y="62" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="11" font-weight="500" fill="white" opacity="0.7" letter-spacing="3">
    SIEMPRE A LA VANGUARDIA
  </text>
</svg>
